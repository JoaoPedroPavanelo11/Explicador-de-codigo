# só postgres e redis; api e front rodam fora do docker em dev

# Nome próprio: sem ele o compose usa o nome da pasta, igual ao do docker-compose.yml,
# e um "up" aqui recriaria o postgres/redis da stack de produção com a config de dev.
name: explicador-de-codigo-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: explicador
      POSTGRES_PASSWORD: explicador
      POSTGRES_DB: explicador
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explicador"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
