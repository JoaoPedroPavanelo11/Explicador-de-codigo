# Infra para desenvolvimento local: apenas Postgres e Redis.
# A API e o frontend rodam na sua máquina com hot-reload.
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: explicador
      POSTGRES_PASSWORD: explicador
      POSTGRES_DB: explicador
    ports:
      - "127.0.0.1:5432:5432" # só acessível a partir da sua máquina
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explicador"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
